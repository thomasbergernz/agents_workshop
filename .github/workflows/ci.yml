# The suite the READMEs advertise as "no network, no API key" -- which is exactly
# what makes it worth running on every push. Lint too, so the ruff config in
# pyproject.toml means something.
name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

defaults:
  run:
    working-directory: kowhai-agent

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1        # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d      # v10.0.1
      - run: uv sync --locked --extra dev
      - run: uv run ruff check .
      - run: uv run pytest -q
      # After the sync: this reads the real test count from pytest, so it needs
      # an environment to read it from.
      - name: The READMEs describe what is actually here
        working-directory: .
        run: python3 .github/scripts/check_docs.py
      - name: Every tool works without a model
        run: |
          uv run scripts/make_workshop_data.py
          uv run kowhai selfcheck
